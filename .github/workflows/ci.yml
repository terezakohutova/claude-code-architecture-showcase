name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Hook tests
        run: node --test tests/hooks.test.js
      - name: Docs check (links, quoted paths, no em/en dash)
        run: node scripts/check-docs.js
      - name: settings.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('.claude/settings.json','utf8'))"
